<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创造模式 · OpenDesign</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeae3;color:#262923;font-family:system-ui}header{padding:24px 32px}h1{font-size:23px;margin:0 0 8px}p{line-height:1.65}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;padding:0 28px 30px}.phone{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:30px;overflow:hidden;min-height:670px;color:var(--ink);box-shadow:0 12px 30px #0001}.title{padding:25px 20px 16px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.title small{display:block;opacity:.65;margin-top:5px}.orb{border:1px solid var(--line);border-radius:50%;width:44px;height:44px;background:var(--surface);display:grid;place-items:center}.art{height:110px;background-image:linear-gradient(transparent,var(--bg)),var(--art);background-size:cover;background-position:center;pointer-events:none}.messages{padding:0 18px 18px}.tag{letter-spacing:.12em;font-size:11px;color:var(--accent);margin:12px 0}.bubble{background:var(--surface);border:1px solid var(--line);padding:16px;border-radius:var(--r) var(--r) var(--r) 7px;line-height:1.8;font-size:15px;box-shadow:0 3px 7px #0001}.user{background:var(--accent);color:#fff;border-color:var(--accent);margin:18px 0 16px 42px;border-radius:var(--r) var(--r) 7px var(--r)}.inventory{background:var(--surface);padding:15px;margin-top:18px;border:1px solid var(--line);border-radius:var(--r)}.inventory h3{font-size:14px;margin:0 0 14px}.item{display:flex;align-items:center;gap:9px}.item span{flex:1}.actions{display:flex;gap:8px;margin-top:12px}button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}.actions button:first-child{color:var(--accent)}footer{margin:0 16px 20px;border:1px solid var(--line);padding:12px 14px;border-radius:24px;background:var(--surface);display:flex;align-items:center;gap:12px}.input{flex:1;font-size:13px;opacity:.6}.pixel .bubble,.pixel .inventory{border-width:2px;box-shadow:3px 3px var(--line)}.pixel button{border-radius:3px}.dungeon .bubble{box-shadow:inset 0 0 0 3px var(--bg),0 4px 6px #0002}.note{font-size:12px;opacity:.7;margin:10px 0}.status{height:22px;font-size:12px;color:var(--accent)}
</style><header><h1>创造模式 · RPG 主题设计基准</h1><p>演示内容 · 四套独立对话表面，侧栏采用玻璃，阅读面板保持清晰。所有装饰不参与点击。</p></header><main id="views"></main><script>
const themes=[['journal','冒险者手札','#E9DFC7','#F5EDD9','#49633B','#98703B','16px'],['sakura','绯樱物语','#F1E9DC','#FCF6EB','#943C42','#A47E54','24px'],['pixel','像素旅人','#DDE6C9','#F2F3DD','#3B573D','#857041','3px'],['dungeon','烬火地牢','#DDD7CE','#EEE8DF','#803E32','#806840','10px']];
for(const [id,title,bg,surface,accent,line,r]of themes){const phone=document.createElement('section');phone.className='phone '+id;phone.style.cssText=`--bg:${bg};--surface:${surface};--accent:${accent};--line:${line};--r:${r};--ink:#252820;--art:url(assets/rpg_${id}.jpg)`;phone.innerHTML=`<div class="title"><span class="orb">‹</span><div><strong>${title}</strong><small>与旅伴继续故事</small></div></div><div class="art"></div><div class="messages"><div class="tag">旅伴 · 剧情示例</div><div class="bubble">酒馆的灯火在雨中摇晃。<br>“路还很长，要先检查一下行囊吗？”</div><div class="bubble user">整理行囊，再出发。</div><div class="inventory"><h3>随身物品 · 清晰阅读面板</h3><div class="item"><span>旅行短剑</span><small>未装备 · 主手</small></div><div class="actions"><button data-action="装备">装备</button><button data-action="丢弃">丢弃</button></div><div class="status" aria-live="polite"></div><div class="note">演示按钮仅预览反馈，不修改应用数据。</div></div></div><footer><span class="orb">＋</span><span class="input">自由输入，推进故事…</span><button>发送</button></footer>`;phone.addEventListener('click',e=>{if(e.target.dataset.action)phone.querySelector('.status').textContent=e.target.dataset.action==='装备'?'预览：已装备到主手':'预览：实际应用需确认后丢弃';});document.querySelector('main').append(phone);}
</script></html>
