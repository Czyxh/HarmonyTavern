[workspace]
resolver = "2"
members = [
    "crates/ttavern",
    "crates/tt-domain",
    "crates/tt-contracts",
    "crates/tt-ports",
    "crates/tt-application",
    "crates/tt-adapter-http",
    "crates/tt-adapter-mcp",
    "crates/tt-adapter-tokenization",
    "crates/tt-adapter-sync",
    "crates/tt-adapter-archive",
    "crates/tt-adapter-extension",
    "crates/tt-adapter-provider-http",
    "crates/tt-adapter-vector",
    "crates/tt-adapter-storage-core",
    "crates/tt-adapter-storage-userdata",
    "crates/tt-adapter-media",
    "crates/tt-adapter-triviumdb",
    "crates/tt-adapter-workspace-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# 对齐上游 src-tauri/Cargo.toml 的 workspace 依赖（crates.io 版本）
[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
ttsync-fs = "2"
ttsync-contract = "2"
ttsync-core = { version = "2", default-features = false }
ttsync-http = "2"
ttsync-client = "2"
uuid = { version = "1.4", default-features = false, features = ["serde", "std", "v4"] }
url = "2.5.8"
# 保留 bundled libzstd 的 target SIMD/assembly 自动检测
zstd = { version = "0.13.3", default-features = false }
triviumdb = "0.8.8"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

# Optimize gemm-f16 until the upstream issue is fixed (上游同款处理)
[profile.dev.package.gemm-f16]
opt-level = 1

[profile.test.package.kitoken]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = "symbols"
